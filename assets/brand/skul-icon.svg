  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect width="100" height="100" rx="24" fill="url(#auroraCyan)"/>
  <rect width="100" height="100" rx="24" fill="url(#auroraAmber)"/>
  <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="#d9e4f1" stroke-opacity="0.12"/>

  <path
