[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "Biome (lint + format)"
language = "system"
entry = "sh -c 'pnpm exec biome check --write \"$@\"; b=$?; git diff --quiet --exit-code -- \"$@\"; d=$?; [ $b -eq 0 ] && [ $d -eq 0 ]' --"
types_or = ["ts", "javascript", "json"]

[[repos.hooks]]
id = "typecheck"
name = "TypeScript typecheck"
language = "system"
entry = "pnpm run typecheck"
pass_filenames = false
types = ["ts"]
