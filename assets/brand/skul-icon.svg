      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="54%" stop-color="#ffd89a"/>
      <stop offset="100%" stop-color="#f4b36a"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
