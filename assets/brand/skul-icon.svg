<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Skul icon</title>
  <desc id="desc">A file-shaped ghost mark with an aurora background, warm fold, cyan eye, and amber terminal cursor on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="14%" y1="6%" x2="86%" y2="94%">
      <stop offset="0%" stop-color="#16304c"/>
      <stop offset="52%" stop-color="#091423"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="24%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraAmber" cx="82%" cy="82%" r="54%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.24"/>
      <stop offset="48%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ghostBloom" cx="46%" cy="24%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghostGrad" x1="50%" y1="14%" x2="50%" y2="96%">
      <stop offset="0%" stop-color="#ffffff"/>
