<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Skul icon</title>
  <desc id="desc">A file-shaped ghost mark with a fold, cyan eye, and terminal cursor on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#162033"/>
      <stop offset="58%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghostGrad" x1="50%" y1="14%" x2="50%" y2="96%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d9e4f1"/>
      <stop offset="72%" stop-color="#8ea2ba" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7b6c9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect width="100" height="100" rx="24" fill="url(#glowGrad)"/>
  <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="#d9e4f1" stroke-opacity="0.14"/>

  <path
    d="M29 18
       H58
       L76 36
       V58
       C76 76 64 87 50 92
       C36 87 24 76 24 58
       V23
       C24 20.239 26.239 18 29 18Z"
    fill="url(#ghostGrad)"
  />

  <path d="M58 18V36H76Z" fill="url(#foldGrad)"/>

  <path
    d="M41 52
       L48.5 44.5
       L56 52
       L48.5 59.5Z"
    fill="url(#accentGrad)"
  />
  <rect x="58" y="56" width="9" height="3" rx="1.5" fill="url(#accentGrad)"/>
