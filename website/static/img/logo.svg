<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Skul mark</title>
  <desc id="desc">A transparent file-shaped ghost mark with a warm fold, cyan eye, and amber terminal cursor.</desc>
  <defs>
    <linearGradient id="ghostGrad" x1="50%" y1="10%" x2="50%" y2="98%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="44%" stop-color="#e5f0fb"/>
      <stop offset="78%" stop-color="#8fb2d0" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#8fb2d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="54%" stop-color="#ffd89a"/>
      <stop offset="100%" stop-color="#f4b36a"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <path
    d="M29 18
       H58
       L76 36
       V58
       C76 76 64 87 50 92
       C36 87 24 76 24 58
       V23
       C24 20.239 26.239 18 29 18Z"
    fill="url(#ghostGrad)"
  />

  <path d="M58 18V36H76Z" fill="url(#foldGrad)"/>

  <path
    d="M41 52
       L48.5 44.5
       L56 52
       L48.5 59.5Z"
    fill="url(#eyeGrad)"
  />
  <rect x="58" y="56" width="9" height="3" rx="1.5" fill="url(#cursorGrad)"/>
</svg>
